<div class="error-panel card border-danger shadow-sm"><div class="card-body"><p class="text-danger fw-semibold mb-1">HTTP {{ problem.status }} · {{ problem.code }}</p><h1 class="h2">{{ problem.title }}</h1><p>{{ problem.detail }}</p>{% if problem.errors %}<ul>{% for error in problem.errors %}<li>{{ error.message }}</li>{% endfor %}</ul>{% endif %}<p class="mb-3">Request ID: <code>{{ problem.request_id }}</code></p><a class="btn btn-primary" href="{{ path_for(request, 'web-dashboard') }}">Return to Dashboard</a></div></div>
