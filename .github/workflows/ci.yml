name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+psycopg://fulfillflow_core:v11-isolated-core-test@127.0.0.1:18541/fulfillflow_core
      TEST_DATABASE_URL: postgresql+psycopg://fulfillflow_core:v11-isolated-core-test@127.0.0.1:18541/fulfillflow_core
      TEST_TRACKING_DATABASE_URL: postgresql+psycopg://fulfillflow_tracking:v11-isolated-tracking-test@127.0.0.1:18541/fulfillflow_tracking
      TEST_LEGACY_DATABASE_URL: postgresql+psycopg://fulfillflow_legacy:v11-isolated-legacy-test@127.0.0.1:18541/fulfillflow_legacy
      TEST_V11_POSTGRES_CONTAINER: fulfillflow-ci-tests-db-1
      INTERNAL_API_SECRET: 9d8e5b6f749941feaf4c88390a3a94b2d80ab13c0a04496babd54cc878f611eb
      SESSION_SECRET: 10446c73ec0243bcbb502e9d7e1739adf6d486aed57b44c1a2a1302478df599e
      CARRIER_ALPHA_WEBHOOK_SECRET: 18374b93133e4996980ef121a823921618481057613d4d119732569639ec7fc8
      CARRIER_BETA_WEBHOOK_SECRET: 1e30d7e5116e4ae39f61d6bd52896149bcabe2b6e21c4cd2a5105366ce4c2795
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Import contracts
        run: uv run lint-imports

      - name: Start isolated owner and legacy databases
        run: docker compose -p fulfillflow-ci-tests -f compose.test.yaml up -d --wait --wait-timeout 120

      - name: Unit, API, and simulator tests
        run: uv run pytest tests/unit tests/api -q

      - name: Verify both owner migration graphs
        run: |
          uv run alembic -c alembic_core.ini upgrade head
          uv run alembic -c alembic_core.ini current --check-heads
          uv run alembic -c alembic_core.ini check
          export DATABASE_URL="$TEST_TRACKING_DATABASE_URL"
          uv run alembic -c alembic_tracking.ini upgrade head
          uv run alembic -c alembic_tracking.ini current --check-heads
          uv run alembic -c alembic_tracking.ini check

      - name: Structural DatabaseProbe Docker integration
        run: uv run pytest tests/integration/test_benchmark_schema_contract.py -q

      - name: PostgreSQL integration tests
        run: >-
          uv run pytest tests/integration -q
          --ignore=tests/integration/test_benchmark_schema_contract.py

      - name: Operational UI tests
        run: uv run pytest tests/ui -q

      - name: External simulator E2E
        run: uv run pytest tests/e2e/test_external_simulator_journey.py -q

      - name: Coverage gate
        run: >-
          uv run pytest --cov=fulfillflow --cov-report=term-missing
          --ignore=tests/integration/test_benchmark_schema_contract.py

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate benchmark Docker Compose
        env:
          BENCH_DATABASE_URL: postgresql+psycopg://fulfillflow:benchmark-ci-db-2026@db:5432/fulfillflow_benchmark
          BENCH_POSTGRES_DB: fulfillflow_benchmark
          BENCH_POSTGRES_USER: fulfillflow
          BENCH_POSTGRES_PASSWORD: benchmark-ci-db-2026
          BENCH_DB_POOL_SIZE: 5
          BENCH_DB_MAX_OVERFLOW: 0
          BENCH_DB_POOL_TIMEOUT_SECONDS: 5
          BENCH_DB_STATEMENT_TIMEOUT_MS: 5000
          BENCH_APP_CPUS: 1.0
          BENCH_APP_MEMORY: 512m
          BENCH_POSTGRES_CPUS: 1.0
          BENCH_POSTGRES_MEMORY: 512m
          BENCH_LOADGEN_CPUS: 1.0
          BENCH_LOADGEN_MEMORY: 512m
          SESSION_SECRET: 99a4f30f5c3f4b69bb7f04a4018a831f
          CARRIER_ALPHA_WEBHOOK_SECRET: 248d825ae4334fb5a019df0bd2bca41d
          CARRIER_BETA_WEBHOOK_SECRET: 5e0062c5d62c49e4abc5c61e9376c951
          BENCHMARK_CAMPAIGN_MANIFEST: benchmarks/fixtures/smoke-campaign.json
          BENCHMARK_LOAD_NAME: synthetic-4-users
        run: docker compose -f compose.benchmark.yaml config --quiet

      - name: Build runtime image
        run: docker compose build core tracking

      - name: Build and smoke loadgen image
        run: |
          docker build --target loadgen --tag fulfillflow-loadgen:ci .
          docker run --rm --entrypoint python fulfillflow-loadgen:ci -c "import locust; from benchmarks.campaign import load_campaign; from pathlib import Path; load_campaign(Path('benchmarks/fixtures/smoke-campaign.json'))"

      - name: Validate owner benchmark Compose
        run: docker compose --env-file .env.benchmark-v11.example -f compose.benchmark-v11.yaml config --quiet

      - name: Smoke test Compose stack
        env:
          POSTGRES_PASSWORD: fulfillflow-compose-ci-2026
        run: |
          docker compose up --detach --no-build --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:8000/health/live
          curl --fail --silent http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error --dump-header /tmp/dashboard.headers --output /tmp/dashboard.html http://127.0.0.1:8000/
          grep --ignore-case --quiet '^content-type: text/html' /tmp/dashboard.headers
          grep --fixed-strings --quiet 'Operational dashboard' /tmp/dashboard.html
          curl --fail --silent --show-error --dump-header /tmp/bootstrap.headers --output /tmp/bootstrap.css http://127.0.0.1:8000/static/vendor/bootstrap-5.3.8.min.css
          grep --ignore-case --quiet '^content-type: text/css' /tmp/bootstrap.headers
          grep --fixed-strings --quiet 'v5.3.8' /tmp/bootstrap.css
          docker compose exec -T core sh -c '[ "$(id -u)" -ne 0 ]'

          docker compose exec -T tracking sh -c '[ "$(id -u)" -ne 0 ]'
          uv run python scripts/prepare_demo_v11.py
          uv run python scripts/prepare_demo_v11.py

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove Compose smoke resources
        if: always()
        run: |
          docker compose down --volumes
          docker compose -p fulfillflow-ci-tests -f compose.test.yaml down --volumes
