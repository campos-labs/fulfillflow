[project]
name = "fulfillflow"
version = "1.1.0"
description = "FulfillFlow Core and Tracking"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1,<1",
    "alembic>=1.19.1,<2",
    "fastapi>=0.141.1,<1",
    "itsdangerous>=2.2.0,<3",
    "jinja2>=3.1.6,<4",
    "psycopg[binary]>=3.3.4,<4",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "uvicorn>=0.52.4,<1",
]

[dependency-groups]
benchmark = [
    "locust>=2.43,<3",
]
dev = [
    "fastapi-cli>=0.0.32,<1",
    "import-linter>=2.13,<3",
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16.4,<1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.7,<0.13"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "alembic", "scripts", "benchmarks"]
extend-exclude = ["AGENTS.md", "DESIGN.md"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["fulfillflow"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts/seed_demo.py", "scripts/seed_benchmark.py", "scripts/prepare_demo_v11.py", "benchmarks"]
# Preserved benchmark evidence may contain detached historical source checkouts.
exclude = ['^benchmarks[/\\]results[/\\]']
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: requires a dedicated PostgreSQL 18 database",
]

[tool.coverage.run]
branch = true
source = ["fulfillflow"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "fulfillflow"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "FulfillFlow package dependencies are acyclic"
type = "acyclic_siblings"
ancestors = ["fulfillflow"]
depth = 2

[[tool.importlinter.contracts]]
name = "Business domain modules are framework independent"
type = "forbidden"
source_modules = [
    "fulfillflow.orders.domain",
    "fulfillflow.shipments.domain",
    "fulfillflow.tracking.domain",
    "fulfillflow.notifications.domain",
]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "fulfillflow.api",
    "fulfillflow.db",
]

[[tool.importlinter.contracts]]
name = "Orders internals are imported only by Orders"
type = "protected"
protected_modules = [
    "fulfillflow.orders.domain",
    "fulfillflow.orders.models",
    "fulfillflow.orders.repository",
    "fulfillflow.orders.service",
]
allowed_importers = ["fulfillflow.orders"]

[[tool.importlinter.contracts]]
name = "Shipments internals are imported only by Shipments"
type = "protected"
protected_modules = [
    "fulfillflow.shipments.domain",
    "fulfillflow.shipments.models",
    "fulfillflow.shipments.receipt_models",
    "fulfillflow.shipments.receipt_repository",
    "fulfillflow.shipments.repository",
    "fulfillflow.shipments.service",
]
allowed_importers = ["fulfillflow.shipments"]

[[tool.importlinter.contracts]]
name = "Carriers internals are imported only by Carriers"
type = "protected"
protected_modules = [
    "fulfillflow.carriers.models",
    "fulfillflow.carriers.repository",
]
allowed_importers = ["fulfillflow.carriers"]

[[tool.importlinter.contracts]]
name = "Tracking internals are imported only by Tracking"
type = "protected"
protected_modules = [
    "fulfillflow.tracking.adapters",
    "fulfillflow.tracking.carrier_schemas",
    "fulfillflow.tracking.authentication",
    "fulfillflow.tracking.domain",
    "fulfillflow.tracking.models",
    "fulfillflow.tracking.repository",
    "fulfillflow.tracking.service",
]
allowed_importers = ["fulfillflow.tracking"]

[[tool.importlinter.contracts]]
name = "Notifications internals are imported only by Notifications"
type = "protected"
protected_modules = [
    "fulfillflow.notifications.domain",
    "fulfillflow.notifications.models",
    "fulfillflow.notifications.repository",
    "fulfillflow.notifications.service",
]
allowed_importers = ["fulfillflow.notifications"]

[[tool.importlinter.contracts]]
name = "Core cannot import Tracking implementation or persistence"
type = "forbidden"
source_modules = [
    "fulfillflow.main", "fulfillflow.core", "fulfillflow.api", "fulfillflow.web",
    "fulfillflow.orders", "fulfillflow.shipments", "fulfillflow.carriers", "fulfillflow.notifications",
]
forbidden_modules = ["fulfillflow.tracking"]

[[tool.importlinter.contracts]]
name = "Tracking cannot import Core implementation or persistence"
type = "forbidden"
source_modules = ["fulfillflow.tracking"]
forbidden_modules = [
    "fulfillflow.main", "fulfillflow.core", "fulfillflow.api", "fulfillflow.web",
    "fulfillflow.orders", "fulfillflow.shipments", "fulfillflow.carriers", "fulfillflow.notifications",
]

[[tool.importlinter.contracts]]
name = "Wire contracts depend on no service implementation or infrastructure"
type = "forbidden"
source_modules = ["fulfillflow.contracts"]
forbidden_modules = [
    "fulfillflow.core", "fulfillflow.api", "fulfillflow.web", "fulfillflow.tracking",
    "fulfillflow.orders", "fulfillflow.shipments", "fulfillflow.carriers", "fulfillflow.notifications",
    "fulfillflow.db", "fulfillflow.http", "fastapi", "sqlalchemy",
]
